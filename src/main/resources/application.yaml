server:
  port: ${LEGALBASES_SERVER_PORT}
spring:
  servlet:
    multipart:
      # Mismo tope en toda la cadena (BFF, legal, legalcase, legalbases y
      # legaltech-tools). Sin declararlo rige el default de Spring —1 MB— y el
      # servicio devuelve 413 a mitad de camino, con el resto de la cadena ya
      # configurada para 50 MB: el error aparece lejos de donde esta la causa.
      max-file-size: 50MB
      max-request-size: 50MB
  cloud:
    compatibility-verifier:
      enabled: false
  application:
    name: legalbases
  datasource:
    url: ${LEGALBASES_SPRING_DATASOURCE_URL}
    username: ${LEGALBASES_SPRING_DATASOURCE_USERNAME}
    password: ${LEGALBASES_SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: legal_bases
aws:
  accessKey: ${LEGALBASES_AWS_ACCESSKEY}
  secretKey: ${LEGALBASES_AWS_SECRETKEY}
  s3:
    region: us-east-1
    bucketname: normatives
